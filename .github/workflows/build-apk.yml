name: Build ChessOverlay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          cat buildsrc/part-*.b64 > /tmp/chessoverlay.b64
          base64 -d /tmp/chessoverlay.b64 > /tmp/chessoverlay.tar.gz
          tar -xzf /tmp/chessoverlay.tar.gz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Cache Stockfish Android binaries
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: stockfish19-android-ndk28-r1

      - name: Fetch Stockfish 19
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch_stockfish_19.sh

      - name: Build Stockfish for Android
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build_stockfish_android.sh

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > /tmp/gradle.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== GRADLE FAILURE TAIL ====='
            tail -n 250 /tmp/gradle.log
            exit "$status"
          fi
          tail -n 80 /tmp/gradle.log

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Verify APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
