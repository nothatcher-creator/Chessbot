name: Build ChessOverlay APK

on:
  push:
    branches: [main, feature/lichess-dom-adapter, feature/unrestricted-detection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          cat buildsrc/part-*.b64 > /tmp/chessoverlay.b64
          base64 -d /tmp/chessoverlay.b64 > /tmp/chessoverlay.tar.gz
          tar -xzf /tmp/chessoverlay.tar.gz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/libs.versions.toml

          cat patches/detection-fix-*.patch.part > /tmp/detection-fix.patch
          echo '9cbc368645cb8f724a0b3bbb14c737f41982de8e9d9c76b4789626f0034f1125  /tmp/detection-fix.patch' | sha256sum -c -
          git apply --check /tmp/detection-fix.patch
          git apply /tmp/detection-fix.patch
          test -f app/src/test/java/com/nothatcher/chessoverlay/regression/DetectionRegressionTest.kt

          cat websrc-v2/part-*.b64 > /tmp/lichess-dom.b64
          base64 -d /tmp/lichess-dom.b64 > /tmp/lichess-dom.tar.gz
          echo '76a21f27c1e7502c3dd68a941ae92ecc1dbdfa3ee5c6288ff8f1ef63ca8e8c2e  /tmp/lichess-dom.tar.gz' | sha256sum -c -
          tar -xzf /tmp/lichess-dom.tar.gz
          test -f app/src/main/java/com/nothatcher/chessoverlay/browser/LichessBrowserActivity.kt
          test -f app/src/main/assets/lichess_adapter.js
          grep -q 'org.junit.Test' app/src/test/java/com/nothatcher/chessoverlay/browser/LichessSitePolicyTest.kt
          grep -q 'org.junit.Test' app/src/test/java/com/nothatcher/chessoverlay/browser/LichessPayloadValidatorTest.kt

          echo '865a0340354d1ee4a19c5721fdc0f89c3438f486e026f15a555d23e6ddfd475d  unrestricted-src-v2/part-00.b64' | sha256sum -c -
          echo '662d070430fd82233271f40da933105d873cd6818fa746bae826258c7cd42f2a  unrestricted-src-v2/part-01.b64' | sha256sum -c -
          echo '5c8ec32374d55036d150e899733ec0dd73a4a6977c6c3e1298ac018b2f93f894  unrestricted-src-v2/part-02.b64' | sha256sum -c -
          echo '046a2f380973132bb270dc1b725956b2146e95a9066c721509866cec8837704d  unrestricted-src-v2/part-03.b64' | sha256sum -c -
          echo 'c5cd11368813841c8f81683648ac29cf516c5cdfc3406582c4918d8bd4bfa9d9  unrestricted-src-v2/part-04.b64' | sha256sum -c -
          cat unrestricted-src-v2/part-*.b64 > /tmp/unrestricted-detection.b64
          base64 -d /tmp/unrestricted-detection.b64 > /tmp/unrestricted-detection.tar.gz
          echo '562ea08c674851ad67804572cc72f988b3684cd6540aab4abf0c4ebe91e853a2  /tmp/unrestricted-detection.tar.gz' | sha256sum -c -
          tar -xzf /tmp/unrestricted-detection.tar.gz
          test -f app/src/main/java/com/nothatcher/chessoverlay/browser/BrowserFallbackPolicy.kt
          test -f app/src/main/java/com/nothatcher/chessoverlay/browser/BrowserDiagnosticsFormatter.kt
          grep -q 'genericActiveGameKeepsDetectionActiveButHintsOff' app/src/test/java/com/nothatcher/chessoverlay/browser/LichessSitePolicyTest.kt
          grep -q 'liveHumanPayloadIsStillDetectedWithoutEngineHints' app/src/test/java/com/nothatcher/chessoverlay/browser/LichessPayloadValidatorTest.kt

          sed -i 's/compileSdk = 37/compileSdk = 36/g' app/build.gradle.kts
          sed -i 's/2026\.08\.01/2026.06.00/g; s/2026\.08\.00/2026.06.00/g' gradle/libs.versions.toml
          sed -i 's/2\.11\.0/2.10.0/g' gradle/libs.versions.toml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nothatcher/chessoverlay/capture/MediaProjectionService.kt')
          s = p.read_text()
          old = 'val mediaProjection = manager.getMediaProjection(resultCode, data)'
          new = 'val mediaProjection = manager.getMediaProjection(resultCode, data) ?: error("MediaProjection unavailable")'
          if old not in s:
              raise SystemExit('Expected MediaProjection construction line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Restore board-recognition model
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconstruct_piece_model.py
          test -s app/src/main/assets/piece_mlp.bin
          echo '2e6579341f341e0e53f848981ff410a4ccb2e2d996ae608ef534f95c79f2c0d8  app/src/main/assets/piece_mlp.bin' | sha256sum -c -

      - name: Validate Lichess recognition regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_lichess_model.py

      - name: Test Lichess DOM adapter
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_lichess_adapter.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Restore Stockfish Android cache
        id: stockfish-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs
          key: stockfish19-android-ndk28-r1

      - name: Fetch Stockfish 19
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch_stockfish_19.sh

      - name: Build Stockfish for Android
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build_stockfish_android.sh

      - name: Save Stockfish Android cache
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs
          key: stockfish19-android-ndk28-r1

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > /tmp/gradle.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== GRADLE FAILURE TAIL ====='
            tail -n 350 /tmp/gradle.log
            exit "$status"
          fi
          tail -n 120 /tmp/gradle.log

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -E 'AndroidManifest.xml|classes.*dex|lib/.*/libstockfish\.so|assets/piece_mlp.bin|assets/lichess_adapter.js'
          unzip -p "$apk" assets/piece_mlp.bin > /tmp/piece_mlp.bin
          echo '2e6579341f341e0e53f848981ff410a4ccb2e2d996ae608ef534f95c79f2c0d8  /tmp/piece_mlp.bin' | sha256sum -c -
          test "$(unzip -l "$apk" | grep -c 'assets/lichess_adapter.js')" -ge 1
          test "$(unzip -l "$apk" | grep -c 'lib/arm64-v8a/libstockfish.so')" -ge 1
          test "$(unzip -l "$apk" | grep -c 'lib/x86_64/libstockfish.so')" -ge 1
          ls -lh "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
