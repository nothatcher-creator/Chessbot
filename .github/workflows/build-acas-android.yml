name: Build ACAS Android M1

on:
  push:
    branches: [feature/acas-android-m1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ACAS Android source
        shell: bash
        run: |
          set -euo pipefail
          cat acasandroid-src/part-*.b64 > /tmp/acas-android.b64
          base64 -d /tmp/acas-android.b64 > /tmp/acas-android.tar.gz
          gzip -t /tmp/acas-android.tar.gz
          tar -tzf /tmp/acas-android.tar.gz >/tmp/acas-android-files.txt
          grep -q '^acas-android/app/src/main/AndroidManifest.xml$' /tmp/acas-android-files.txt
          tar -xzf /tmp/acas-android.tar.gz
          test -f acas-android/app/src/main/AndroidManifest.xml
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/AcasAccessibilityService.java
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/ProjectionService.java
          test -f acas-android/app/src/test/java/com/nothatcher/acasbridge/BoardStateResolverTest.java
          ! grep -q 'android.permission.INTERNET' acas-android/app/src/main/AndroidManifest.xml
          sha256sum /tmp/acas-android.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run M1 unit tests
        working-directory: acas-android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Assemble M1 APK
        working-directory: acas-android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify M1 APK
        shell: bash
        run: |
          set -euo pipefail
          apk='acas-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -E 'AndroidManifest.xml|classes.*dex'
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload M1 APK
        uses: actions/upload-artifact@v4
        with:
          name: ACAS-Android-M1-debug
          path: acas-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
