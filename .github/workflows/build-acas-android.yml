name: Build ACAS Android M1

on:
  push:
    branches:
      - feature/acas-android-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ACAS Android source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf acas-android
          mkdir -p acas-android

          # Recover every complete file available from the older source archive.
          # Its gzip trailer is truncated, so gzip/tar may return non-zero even
          # though the earlier members are recoverable.
          set +e
          gzip -dc acasandroid-src/acas-android.tar.gz > /tmp/acas-android.tar
          gzip_status=$?
          tar -xf /tmp/acas-android.tar --ignore-zeros
          tar_status=$?
          set -e
          echo "source salvage: gzip=$gzip_status tar=$tar_status"

          # Overlay clean source/config for every file that was missing or
          # potentially damaged in the recovered archive.
          cp -a acasandroid-overlay/. acas-android/

          test -f acas-android/settings.gradle.kts
          test -f acas-android/build.gradle.kts
          test -f acas-android/gradle.properties
          test -f acas-android/app/build.gradle.kts
          test -f acas-android/app/src/main/AndroidManifest.xml
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/AcasAccessibilityService.java
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/ProjectionService.java
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/MainActivity.java
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/BoardStateResolver.java
          test -f acas-android/app/src/main/java/com/nothatcher/acasbridge/SanTokenExtractor.java
          test -f acas-android/app/src/test/java/com/nothatcher/acasbridge/BoardStateResolverTest.java
          test -f acas-android/app/src/test/java/com/nothatcher/acasbridge/SanTokenExtractorTest.java
          test -f acas-android/app/src/test/java/com/nothatcher/acasbridge/TargetAppClassifierTest.java
          ! grep -q 'android.permission.INTERNET' acas-android/app/src/main/AndroidManifest.xml
          grep -q 'com.android.chrome' acas-android/app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'org.lichess.mobileV2' acas-android/app/src/main/res/xml/accessibility_service_config.xml
          echo "Recovered/overlaid source files:"
          find acas-android -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run M1 unit tests
        working-directory: acas-android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Assemble M1 APK
        working-directory: acas-android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify M1 APK
        shell: bash
        run: |
          set -euo pipefail
          apk='acas-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -E 'AndroidManifest.xml|classes.*dex'
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload M1 APK
        uses: actions/upload-artifact@v4
        with:
          name: ACAS-Android-M1-debug
          path: acas-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
